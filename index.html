<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jon Wexler | Personal Pass</title>
<meta name="description" content="Personal contact pass for Jon Wexler.">
<style>
  :root {
    --ink: #1c2430;
    --muted: #677180;
    --line: #d9dee5;
    --page: #eef1f5;
    --card: #ffffff;
    --accent: #1f4e79;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px;
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .logo { width: 72px; height: 72px; display: block; }
  .pass {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(28, 36, 48, .12);
    overflow: hidden;
  }
  .head {
    background: var(--accent);
    color: #fff;
    padding: 14px 24px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .details { padding: 24px; }
  .label {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .value { margin: 0 0 20px; font-size: 18px; font-weight: 600; }
  .name { font-size: 28px; line-height: 1.15; }
  .value:last-child { margin-bottom: 0; }
  .value a { color: inherit; text-decoration: none; }
  .tear { border-top: 2px dashed var(--line); margin: 0 24px; }
  .code { padding: 24px; text-align: center; }
  #barcode { display: block; width: 100%; height: 96px; }
  .code p { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .notice {
    margin: 0;
    padding: 12px 24px;
    background: #f6f7f9;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <!-- Replace this SVG with <img class="logo" src="logo.png" alt="Logo"> to use your own logo. -->
  <svg class="logo" viewBox="0 0 72 72" role="img" aria-label="JW logo">
    <rect width="72" height="72" rx="16" fill="#1f4e79"/>
    <text x="36" y="46" text-anchor="middle" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">JW</text>
  </svg>

  <main class="pass">
    <div class="head">Personal Pass</div>
    <div class="details">
      <p class="label">Name</p>
      <p class="value name">Jon Wexler</p>
      <p class="label">Date</p>
      <p class="value"><time id="today"></time></p>
      <p class="label">Website</p>
      <p class="value"><a href="https://jonwexler.com">jonwexler.com</a></p>
    </div>
    <div class="tear"></div>
    <div class="code">
      <svg id="barcode" role="img" aria-label="Barcode for jonwexler.com" preserveAspectRatio="none"></svg>
      <p id="barcode-text"></p>
    </div>
    <p class="notice">Personal contact card. Not a ticket. Not valid for event admission.</p>
  </main>

  <script>
    // Minimal Code 128 (code set B) encoder. Returns a string of 1s (bars) and 0s (spaces).
    var CODE128_PATTERNS = [
      '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
      '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
      '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
      '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
      '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
      '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
      '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
      '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
      '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
      '214121','412121','111143','111341','131141','114113','114311','411113','411311','113141',
      '114131','311141','411131','211412','211214','211232'
    ];
    var CODE128_STOP = '2331112';

    function code128B(text) {
      var START_B = 104;
      var codes = [START_B];
      var sum = START_B;
      for (var i = 0; i < text.length; i++) {
        var value = text.charCodeAt(i) - 32;
        if (value < 0 || value > 94) throw new Error('Unsupported character: ' + text[i]);
        codes.push(value);
        sum += value * (i + 1);
      }
      codes.push(sum % 103);

      var widths = codes.map(function (c) { return CODE128_PATTERNS[c]; }).join('') + CODE128_STOP;
      var out = '';
      for (var j = 0; j < widths.length; j++) {
        out += (j % 2 === 0 ? '1' : '0').repeat(Number(widths[j]));
      }
      return out;
    }

    var today = new Date();
    var el = document.getElementById('today');
    el.textContent = today.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });

    var text = 'https://jonwexler.com';
    var modules = code128B(text);
    var quiet = 10;
    var svg = document.getElementById('barcode');
    svg.setAttribute('viewBox', '0 0 ' + (modules.length + quiet * 2) + ' 60');
    svg.setAttribute('shape-rendering', 'crispEdges');
    var rects = '<rect width="100%" height="100%" fill="#fff"/>';
    for (var i = 0; i < modules.length; i++) {
      if (modules[i] !== '1') continue;
      var start = i;
      while (modules[i + 1] === '1') i++;
      rects += '<rect x="' + (start + quiet) + '" y="0" width="' + (i - start + 1) + '" height="60" fill="#000"/>';
    }
    svg.innerHTML = rects;
    document.getElementById('barcode-text').textContent = text.replace('https://', '');
  </script>
</body>
</html>
