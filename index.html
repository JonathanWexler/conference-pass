<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACR | Personal Pass</title>
    <meta name="description" content="Personal contact pass for Jon Wexler." />
    <style>
      :root {
        --ink: #1c2430;
        --muted: #677180;
        --line: #d9dee5;
        --page: #eef1f5;
        --card: #ffffff;
        --accent: #1f4e79;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 32px 16px;
        background: var(--page);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .logo {
        display: block;
        width: 152px;
        max-width: 100%;
        height: auto;
      }
      .profile {
        display: block;
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 50%;
      }
      .address {
        margin: -12px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-style: normal;
        line-height: 1.5;
      }
      [hidden] { display: none !important; }
      img.profile { object-fit: cover; }
      .name { overflow-wrap: anywhere; }
      #edit-profile { color: var(--accent); }
      #profile-editor { width: 100%; max-width: 380px; padding: 24px; background: white; border-radius: 16px; }
      #profile-editor label { display: block; margin-bottom: 16px; }
      #profile-editor input { display: block; width: 100%; margin-top: 8px; font: inherit; }
      #profile-editor input[type="text"], #profile-editor input[type="url"] { padding: 10px; }
      #profile-editor button { padding: 10px 16px; font: inherit; cursor: pointer; }
      .pass {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(28, 36, 48, 0.12);
        overflow: hidden;
      }
      .head {
        background: var(--accent);
        color: #fff;
        padding: 14px 24px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .details {
        padding: 24px;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 4px;
      }
      .value {
        margin: 0 0 20px;
        font-size: 18px;
        font-weight: 600;
      }
      .name {
        font-size: 28px;
        line-height: 1.15;
      }
      .value:last-child {
        margin-bottom: 0;
      }
      .value a {
        color: inherit;
        text-decoration: none;
      }
      .tear {
        border-top: 2px dashed var(--line);
        margin: 0 24px;
      }
      .code {
        padding: 24px;
        text-align: center;
      }
      #barcode {
        display: block;
        width: 100%;
        height: 96px;
      }
      .code p {
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .notice {
        margin: 0;
        padding: 12px 24px;
        background: #f6f7f9;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <img
      class="logo"
      src="assets/acr-logo.png"
      alt="ACR — American College of Rheumatology"
      width="152"
      height="96"
    />
    <main class="pass">
      <div class="head">ATTENDEE</div>
      <div class="details">
        <svg
          id="profile-placeholder"
          class="profile"
          viewBox="0 0 120 120"
          role="img"
          aria-label="Profile photo placeholder"
        >
          <circle cx="60" cy="43" r="20" fill="#d9dee5" />
          <path d="M24 103c0-22 16-35 36-35s36 13 36 35" fill="#d9dee5" />
        </svg>
        <img class="profile" id="profile-photo" alt="Profile photo" hidden />
        <p class="label">Name</p>
        <p class="value name" id="profile-name">Jon Wexler</p>
        <p class="label">Date</p>
        <p class="value"><time datetime="2026-11-09">November 9, 2026</time></p>
        <p class="label">CONVENTION</p>
        <p class="value">Convention Name</p>
        <address class="address">
          Orange County Convention Center<br />9800 International Drive<br />Orlando,
          FL 32819
        </address>
      </div>
      <div class="tear"></div>
      <div class="code">
        <svg
          id="barcode"
          role="img"
          aria-label="Generic barcode: 123456789012"
          preserveAspectRatio="none"
        ></svg>
        <p id="barcode-text"></p>
      </div>
    </main>
    <a href="#profile-editor" id="edit-profile" aria-expanded="false" aria-controls="profile-editor">Profile</a>
    <form id="profile-editor" hidden>
      <label>Name<input id="name-input" required maxlength="100" type="text" autocomplete="name" /></label>
      <label>Profile photo<input id="photo-input" type="file" accept="image/*" /></label>
      <label>Or use an image URL<input id="photo-url" type="url" placeholder="https://example.com/photo.jpg" /></label>
      <button type="submit">Save profile</button>
      <button type="button" id="cancel-profile">Cancel</button>
      <p id="profile-status" role="status"></p>
    </form>

    <script>
      const editor = document.getElementById("profile-editor");
      const link = document.getElementById("edit-profile");
      const nameInput = document.getElementById("name-input");
      const photoInput = document.getElementById("photo-input");
      const photoUrl = document.getElementById("photo-url");
      function isPhotoUrl(value) {
        try { return ["https:", "http:"].includes(new URL(value).protocol); }
        catch (_) { return false; }
      }
      const status = document.getElementById("profile-status");
      let profile = { name: "Jon Wexler", photo: "" };
      try {
        const saved = JSON.parse(localStorage.getItem("personal-pass-profile"));
        if (saved && typeof saved.name === "string" && saved.name.trim()) {
          profile.name = saved.name;
          if (typeof saved.photo === "string" && (saved.photo.startsWith("data:image/") || isPhotoUrl(saved.photo))) profile.photo = saved.photo;
        }
      } catch (_) {}
      function renderProfile() {
        document.getElementById("profile-name").textContent = profile.name;
        document.title = profile.name + " | Personal Pass";
        const photo = document.getElementById("profile-photo");
        photo.hidden = !profile.photo;
        document.getElementById("profile-placeholder").toggleAttribute("hidden", !!profile.photo);
        if (profile.photo) { photo.src = profile.photo; photo.alt = profile.name + " profile photo"; }
      }
      renderProfile();
      function closeEditor() {
        editor.hidden = true;
        link.setAttribute("aria-expanded", "false");
        link.focus();
      }
      link.addEventListener("click", function (event) {
        event.preventDefault();
        editor.hidden = false;
        link.setAttribute("aria-expanded", "true");
        nameInput.value = profile.name;
        photoInput.value = "";
        photoUrl.value = isPhotoUrl(profile.photo) ? profile.photo : "";
        status.textContent = "";
        nameInput.focus();
      });
      document.getElementById("cancel-profile").addEventListener("click", closeEditor);
      photoInput.addEventListener("change", function () { if (photoInput.files.length) photoUrl.value = ""; });
      photoUrl.addEventListener("input", function () { if (photoUrl.value.trim()) photoInput.value = ""; });
      nameInput.addEventListener("input", function () { nameInput.setCustomValidity(""); });
      editor.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!nameInput.value.trim()) { nameInput.setCustomValidity("Enter your name."); nameInput.reportValidity(); return; }
        const button = editor.querySelector('[type="submit"]');
        button.disabled = true;
        status.textContent = "";
        try {
          let photo = profile.photo;
          const file = photoInput.files[0];
          if (file) {
            if (!file.type.startsWith("image/")) throw new Error("Choose an image file.");
            const url = URL.createObjectURL(file);
            try {
              const image = new Image();
              image.src = url;
              await image.decode();
              const canvas = document.createElement("canvas");
              canvas.width = canvas.height = 480;
              const context = canvas.getContext("2d");
              const side = Math.min(image.naturalWidth, image.naturalHeight);
              context.fillStyle = "white";
              context.fillRect(0, 0, 480, 480);
              context.drawImage(image, (image.naturalWidth - side) / 2, (image.naturalHeight - side) / 2, side, side, 0, 0, 480, 480);
              photo = canvas.toDataURL("image/jpeg", 0.85);
            } catch (_) { throw new Error("Unable to open this photo. Try a JPG or PNG image."); }
            finally { URL.revokeObjectURL(url); }
          } else if (photoUrl.value.trim()) {
            const url = photoUrl.value.trim();
            if (!isPhotoUrl(url)) throw new Error("Enter an HTTP or HTTPS image URL.");
            const image = new Image();
            image.src = url;
            try { await image.decode(); }
            catch (_) { throw new Error("Unable to load this image URL. Check the link or upload a photo instead."); }
            photo = url;
          }
          profile = { name: nameInput.value.trim(), photo: photo };
          renderProfile();
          try { localStorage.setItem("personal-pass-profile", JSON.stringify(profile)); }
          catch (_) { status.textContent = "Updated for this visit. Browser storage is unavailable, so changes cannot be saved for next time."; return; }
          closeEditor();
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      });
      // Minimal Code 128 (code set B) encoder. Returns a string of 1s (bars) and 0s (spaces).
      var CODE128_PATTERNS = [
        "212222",
        "222122",
        "222221",
        "121223",
        "121322",
        "131222",
        "122213",
        "122312",
        "132212",
        "221213",
        "221312",
        "231212",
        "112232",
        "122132",
        "122231",
        "113222",
        "123122",
        "123221",
        "223211",
        "221132",
        "221231",

        "223112",
        "312131",

        "111143",

        "411311",
        "113141",
        "114131",
        "311141",
        "411131",
        "211412",
        "211214",
        "211232",
      ];
      var CODE128_STOP = "2331112";

      function code128B(text) {
        var START_B = 104;
        var codes = [START_B];
        var sum = START_B;
        for (var i = 0; i < text.length; i++) {
          var value = text.charCodeAt(i) - 32;
          if (value < 0 || value > 94)
            throw new Error("Unsupported character: " + text[i]);
          codes.push(value);
          sum += value * (i + 1);
        }
        codes.push(sum % 103);

        var widths =
          codes
            .map(function (c) {
              return CODE128_PATTERNS[c];
            })
            .join("") + CODE128_STOP;
        var out = "";
        for (var j = 0; j < widths.length; j++) {
          out += (j % 2 === 0 ? "1" : "0").repeat(Number(widths[j]));
        }
        return out;
      }

      var text = "123456789012";
      var modules = code128B(text);
      var quiet = 10;
      var svg = document.getElementById("barcode");
      svg.setAttribute(
        "viewBox",
        "0 0 " + (modules.length + quiet * 2) + " 60",
      );
      svg.setAttribute("shape-rendering", "crispEdges");
      var rects = '<rect width="100%" height="100%" fill="#fff"/>';
      for (var i = 0; i < modules.length; i++) {
        if (modules[i] !== "1") continue;
        var start = i;
        while (modules[i + 1] === "1") i++;
        rects +=
          '<rect x="' +
          (start + quiet) +
          '" y="0" width="' +
          (i - start + 1) +
          '" height="60" fill="#000"/>';
      }
      svg.innerHTML = rects;
      document.getElementById("barcode-text").textContent = text;
    </script>
  </body>
</html>
